[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MorrisKM/Tuma"
authors = ["The Tuma Contributors"]

[workspace.dependencies]
tuma-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
# preserve_order everywhere, so JSON output (CLI, schemas) has the same key order whatever is being built.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Dependencies are built without debug info: it is most of the size of target/ (tens of GB for this workspace) and
# rarely needed.
[profile.dev.package."*"]
debug = false

# Tuma's own crates keep file and line numbers for backtraces, without full debug info: with incremental builds
# across the app, CLI and tests, full debug info filled more than 10 GB.
[profile.dev]
debug = "line-tables-only"
