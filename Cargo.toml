[workspace]
resolver = "3"
members = ["crates/core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MorrisKM/Tuma"
authors = ["The Tuma Contributors"]

[workspace.dependencies]
tuma-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
