[package]
name = "tuma-cli"
description = "Tuma from the command line and for AI agents: send requests, run saved tests, serve MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tuma"
path = "src/main.rs"

[dependencies]
tuma-core.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "signal"] }
anyhow = "1"
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
url = "2"
