[package]
name = "tuma-core"
description = "Tuma's engine: HTTP, templating, storage and importers, with no UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23"
brotli = "9"
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
bytes = "1"
dirs = "6"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema = { version = "0.60", default-features = false }
keyring = "4"
md-5 = "0.11"
mime_guess = "2"
p12-keystore = "=0.3.2"
percent-encoding = "2"
regex = "1"
ring = "0.17"
rquickjs = "0.14"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protox = "=0.9.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
schemars = "1"
serde.workspace = true
serde-saphyr = "2"
serde_json.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["net", "time", "fs", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", default-features = false }
tokio-stream = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2", "server-auto"] }
rcgen = "0.14"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router", "codegen"] }
tonic-reflection = "0.14"
tokio-stream = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
