[package]
name = "tuma-app"
description = "A fast, local-first API client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (https://github.com/rust-lang/cargo/issues/8519)
name = "tuma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tuma-core.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "=2.13.2"
tokio = { workspace = true, features = ["sync"] }
base64 = "0.23"
handlebars = "6.4"
serde.workspace = true
serde_json.workspace = true
url = "2"
